openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VulnBank API - accounts, transfers, cards and customer administration
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: accounts
    description: Bank account operations
  - name: transactions
    description: Transaction operations
  - name: transfers
    description: Money transfer operations
  - name: users
    description: User profile operations
  - name: admin
    description: Admin operations
  - name: dashboard
    description: Dashboard summary data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /accounts:
    get:
      operationId: getAccounts
      tags: [accounts]
      summary: Get all accounts for current user
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get account by ID
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: Get transactions
      parameters:
        - name: accountId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search term
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get transaction by ID
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transfers:
    post:
      operationId: createTransfer
      tags: [transfers]
      summary: Transfer money between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferBody"
      responses:
        "200":
          description: Transfer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary for current user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent transactions across all accounts
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: Get all users (broken access control - no real auth check)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{userId}/reset-password:
    post:
      operationId: adminResetPassword
      tags: [admin]
      summary: Reset user password (broken access control)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Get system-wide statistics
      responses:
        "200":
          description: System stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/audit-logs:
    get:
      operationId: adminGetAuditLogs
      tags: [admin]
      summary: Get audit logs
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
    post:
      operationId: adminCreateAuditLog
      tags: [admin]
      summary: Create audit log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditLogBody"
      responses:
        "201":
          description: Audit log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLog"

  /admin/transactions:
    get:
      operationId: adminGetTransactions
      tags: [admin]
      summary: Get all transactions system-wide
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: All transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransaction"

  /webhook/notify:
    post:
      operationId: webhookNotify
      tags: [admin]
      summary: Send webhook notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookBody"
      responses:
        "200":
          description: Webhook result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    RegisterBody:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
      required:
        - username
        - email
        - password
        - fullName

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - fullName
        - role
        - createdAt

    UpdateUserBody:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        address:
          type: string

    Account:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        accountNumber:
          type: string
        accountType:
          type: string
          enum: [checking, savings, investment]
        balance:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - accountNumber
        - accountType
        - balance
        - currency
        - createdAt

    Transaction:
      type: object
      properties:
        id:
          type: integer
        accountId:
          type: integer
        type:
          type: string
          enum: [credit, debit, transfer]
        amount:
          type: number
        description:
          type: string
        category:
          type: string
        balanceAfter:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - type
        - amount
        - description
        - category
        - balanceAfter
        - createdAt

    TransferBody:
      type: object
      properties:
        fromAccountId:
          type: integer
        toAccountId:
          type: integer
        amount:
          type: number
        description:
          type: string
      required:
        - fromAccountId
        - toAccountId
        - amount

    TransferResult:
      type: object
      properties:
        success:
          type: boolean
        transactionId:
          type: integer
        message:
          type: string
      required:
        - success
        - message

    DashboardSummary:
      type: object
      properties:
        totalBalance:
          type: number
        totalAccounts:
          type: integer
        monthlyIncome:
          type: number
        monthlyExpenses:
          type: number
        savingsRate:
          type: number
        accountBreakdown:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              balance:
                type: number
              count:
                type: integer
            required:
              - type
              - balance
              - count
      required:
        - totalBalance
        - totalAccounts
        - monthlyIncome
        - monthlyExpenses
        - savingsRate
        - accountBreakdown

    ResetPasswordBody:
      type: object
      properties:
        newPassword:
          type: string
      required:
        - newPassword

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalAccounts:
          type: integer
        totalTransactions:
          type: integer
        totalVolume:
          type: number
        activeUsers:
          type: integer
        flaggedTransactions:
          type: integer
        newUsersToday:
          type: integer
        volumeToday:
          type: number
      required:
        - totalUsers
        - totalAccounts
        - totalTransactions
        - totalVolume
        - activeUsers
        - flaggedTransactions
        - newUsersToday
        - volumeToday

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        details:
          type: string
        userId:
          type: integer
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - details
        - createdAt

    CreateAuditLogBody:
      type: object
      properties:
        action:
          type: string
        details:
          type: string
      required:
        - action
        - details

    AdminTransaction:
      type: object
      properties:
        id:
          type: integer
        accountId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        type:
          type: string
        amount:
          type: number
        description:
          type: string
        category:
          type: string
        balanceAfter:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - userId
        - username
        - type
        - amount
        - description
        - category
        - balanceAfter
        - createdAt

    WebhookBody:
      type: object
      properties:
        url:
          type: string
        event:
          type: string
        payload:
          type: object
      required:
        - url
        - event

    WebhookResult:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        responseBody:
          type: string
        message:
          type: string
      required:
        - success
        - message
